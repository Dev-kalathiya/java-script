<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Financial Tracker</title>
  <!-- ✅ Favicon (wallet icon) -->
<link rel="icon" href="https://image.similarpng.com/file/similarpng/very-thumbnail/2021/08/Illustration-of-Business-Finance-logo-design-on-transparent-background-PNG.png" type="image/png">


  <!-- Styles & Fonts -->
  <link rel="stylesheet" href="./style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <!-- ✅ jsPDF & AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

</head>
<body>
  <div class="background">
    <div class="container">
      <header>
        <h1><i class="fas fa-wallet"></i> Personal Financial Tracker</h1>
      </header>

      <main>
        <!-- Form Section -->
        <section class="form-section">
          <h2><i class="fas fa-plus-circle"></i> Transaction Detail</h2>
          <form id="transaction-form">
            <div class="form-group">
              <label for="description">Description</label>
              <input type="text" id="description" required />
            </div>
            <div class="form-group">
              <label for="amount">Amount</label>
              <input type="number" id="amount" step="0.01" required />
            </div>
            <div class="form-group">
              <label for="category">Category</label>
              <select id="category" required>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
              </select>
            </div>
            <div class="form-group">
              <label for="date"><i class="fas fa-calendar-alt"></i> Date</label>
              <input type="date" id="date" required />
            </div>
            <div class="form-group button-group">
              <button type="submit"><i class="fas fa-plus"></i> Add Transaction</button>
              <button type="button" id="reset-btn"><i class="fas fa-trash-alt"></i> Reset All</button>
            </div>
          </form>
        </section>

        <!-- Summary -->
        <section class="summary-section">
          <h2><i class="fas fa-chart-line"></i> Financial Overview</h2>
          <div class="summary-item">
            <span class="label"><i class="fas fa-balance-scale"></i> Balance:</span>
            <span id="balance">₹0.00</span>
          </div>
          <div class="summary-item">
            <span class="label"><i class="fas fa-arrow-up"></i> Total Income:</span>
            <span id="total-income">₹0.00</span>
          </div>
          <div class="summary-item">
            <span class="label"><i class="fas fa-arrow-down"></i> Total Expenses:</span>
            <span id="total-expenses">₹0.00</span>
          </div>
          <div class="summary-item">
            <span class="label"><i class="fas fa-calendar"></i> Current Month:</span>
            <span id="current-month">April 2025</span>
          </div>
        </section>

        <!-- Chart -->
        <section class="chart-section">
          <h2><i class="fas fa-chart-pie"></i> Income vs Expenses</h2>
          <canvas id="myChart"></canvas>
        </section>

        <!-- Transactions -->
        <section class="transactions-section">
          <h2><i class="fas fa-receipt"></i> Transactions</h2>
          <div class="filter-controls">
            <select id="view-type">
              <option value="all">All Transactions</option>
              <option value="month">Current Month</option>
              <option value="year">Current Year</option>
              <option value="custom">Custom Range</option>
            </select>
            <div id="custom-range-filters" style="display: none">
              <input type="date" id="start-date" />
              <span>to</span>
              <input type="date" id="end-date" />
            </div>
            <select id="filter-category">
              <option value="all">All Categories</option>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
            <button onclick="resetFilters()">Reset Filters</button>
          </div>

          <ul id="transactions-list"></ul>

          <div class="export-buttons">
            <button onclick="exportToPDF()"><i class="fas fa-file-pdf"></i> Export to PDF</button>
            <button onclick="exportToExcel()"><i class="fas fa-file-excel"></i> Export to Excel</button>
            <button onclick="exportToJSON()"><i class="fas fa-file-code"></i> Export to JSON</button>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Your Script -->
  <script src="script.js"></script>
</body>
</html>
